
name: Build Terousd Stream

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build plugins
        run: gradle make makePluginsJson

      - name: Prepare repository files
        run: |
          mkdir -p dist
          find . -name "*.cs3" -not -path "./dist/*" -exec cp {} dist/ \;
          cp build/plugins.json dist/plugins.json

      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: ./dist
          force_orphan: true
          
